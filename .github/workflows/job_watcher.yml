name: Daily Job Watcher

on:
  schedule:
    # Runs daily at 17:00 UTC (12:00 PM / Noon CDT)
    - cron: '0 17 * * *'
  workflow_dispatch: # Enables manual trigger button

jobs:
  run-watcher:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Job Watcher script
        run: python job_watcher.py

      - name: Commit updated seen_jobs.json state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated state update: seen_jobs.json" && git push)
